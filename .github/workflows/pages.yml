name: Publicar Liga Skalama
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v6
      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
     
      - name: Gerar configuração pública da Supabase
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const config = {
            supabaseUrl: process.env.SUPABASE_URL,
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY
          };

          if (!config.supabaseUrl || !config.supabaseAnonKey) {
            throw new Error('As variáveis da Supabase não estão configuradas.');
          }

          fs.writeFileSync(
            'public/config.js',
            `window.LIGA_CONFIG = ${JSON.stringify(config)};\n`
          );
          NODE

      - name: Gerar o site Next.js
        run: pnpm build
        env:
          NEXT_PUBLIC_ASSET_VERSION: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Preservar os arquivos estáticos do Next
        run: touch out/.nojekyll
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4

